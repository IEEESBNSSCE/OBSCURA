<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded cyber container -->
  <rect width="64" height="64" rx="14" fill="#050706" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#B6FF4A" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Eye almond sclera -->
  <path d="M 8 32 C 18 15, 46 15, 56 32 C 46 49, 18 49, 8 32 Z"
        fill="#0c180f"
        stroke="#B6FF4A"
        stroke-width="3"
        stroke-linejoin="round" />

  <!-- Iris -->
  <circle cx="32" cy="32" r="11" fill="#143218" stroke="#B6FF4A" stroke-width="2" />
  
  <!-- Cyber dashed reticle ring -->
  <circle cx="32" cy="32" r="7.5" stroke="#B6FF4A" stroke-width="1.2" stroke-dasharray="3 1.8" opacity="0.8" />

  <!-- Neon green glowing pupil -->
  <circle cx="32" cy="32" r="4.5" fill="#B6FF4A" />

  <!-- Center aperture point -->
  <circle cx="32" cy="32" r="1.5" fill="#050706" />

  <!-- Specular glint -->
  <circle cx="29.5" cy="28.5" r="1.2" fill="#ffffff" />

  <!-- Reticle crosshair tick marks -->
  <line x1="4" y1="32" x2="9" y2="32" stroke="#B6FF4A" stroke-width="1.8" stroke-linecap="round" />
  <line x1="55" y1="32" x2="60" y2="32" stroke="#B6FF4A" stroke-width="1.8" stroke-linecap="round" />
  <line x1="32" y1="10" x2="32" y2="14" stroke="#B6FF4A" stroke-width="1.8" stroke-linecap="round" />
  <line x1="32" y1="50" x2="32" y2="54" stroke="#B6FF4A" stroke-width="1.8" stroke-linecap="round" />
</svg>

